[project]
name = "ship-cycle-mcp"
version = "0.1.0"
description = "An MCP server that turns GitHub activity into launch-ready updates."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "mcp[cli]>=1.13.1,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
]

[project.scripts]
ship-cycle-mcp = "server.main:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["server*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
